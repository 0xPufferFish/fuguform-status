# FuguForm uptime monitor — checks every 5 minutes from GitHub Actions. A failed check opens a GitHub
# issue assigned to the owner (GitHub notifies by email / mobile push) and closes it on recovery.
owner: 0xPufferFish
repo: fuguform-status

sites:
  # The API Worker itself: the Pages SPA fallback also answers 200 on a missing route, so the body is checked.
  - name: API
    url: https://app.fuguform.com/api/health
    __dangerous__body_down_if_text_missing: '"ok":true'
  - name: Builder
    url: https://app.fuguform.com/masuk
  - name: fuguform.com
    url: https://fuguform.com/
    __dangerous__body_down_if_text_missing: FuguForm
  # One live tenant page (the renderer Worker + KV). Swap for a demo tenant if DuckDive is ever deactivated.
  - name: Tenant page (DuckDive)
    url: https://duckdive.fuguform.com/
    __dangerous__body_down_if_text_missing: DuckDive

assignees:
  - 0xPufferFish

# status-website and i18n are the only blocks this repo's restyle touches (plus assets/) — see
# docs/BUILDER_DESIGN.md §2/§4 in the main fuguform repo for the palette/type/component source this
# maps onto. theme: light is forced because the builder has no dark surface to match against.
status-website:
  baseUrl: /fuguform-status
  name: FuguForm
  introTitle: "Status layanan FuguForm"
  introMessage: "Diperiksa otomatis setiap 5 menit — kalau ada gangguan, akan tercatat di sini."
  theme: light
  logoUrl: https://0xpufferfish.github.io/fuguform-status/favicon.svg
  hideNavLogo: true
  faviconSvg: https://0xpufferfish.github.io/fuguform-status/favicon.svg
  # _layout.svelte's PNG <link rel="icon"> falls back to `${baseUrl}/logo-192.png` computed from
  # an older published @upptime/status-page build that drops the baseUrl prefix (renders
  # `/logo-192.png`, 404s outside a root-domain deploy) — set explicitly so it resolves.
  favicon: https://0xpufferfish.github.io/fuguform-status/logo-192.png
  navbar:
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
  customHeadHtml: <meta name="theme-color" content="#33348C">
  css: |
    /* ============================================================
       FuguForm status page — restyle of the stock Upptime theme.
       Palette, radii, shadows and type from docs/BUILDER_DESIGN.md §2 (main fuguform repo);
       fonts self-hosted (the same fontsource woff2 files the builder loads, copied into
       assets/fonts/) rather than a Google Fonts request — this footer promises no third-party
       scripts, a status page shouldn't be the exception.
       ============================================================ */

    @font-face {
      font-family: 'Plus Jakarta Sans';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('https://0xpufferfish.github.io/fuguform-status/fonts/plus-jakarta-sans-latin-400-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Plus Jakarta Sans';
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url('https://0xpufferfish.github.io/fuguform-status/fonts/plus-jakarta-sans-latin-500-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Plus Jakarta Sans';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('https://0xpufferfish.github.io/fuguform-status/fonts/plus-jakarta-sans-latin-600-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Bricolage Grotesque';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('https://0xpufferfish.github.io/fuguform-status/fonts/bricolage-grotesque-latin-600-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Bricolage Grotesque';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('https://0xpufferfish.github.io/fuguform-status/fonts/bricolage-grotesque-latin-700-normal.woff2') format('woff2');
    }
    @font-face {
      font-family: 'IBM Plex Mono';
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url('https://0xpufferfish.github.io/fuguform-status/fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2');
    }

    :root {
      /* Upptime's own theme variables (themes/light.css), remapped to docs/BUILDER_DESIGN.md §2 */
      --body-background-color: #EDF0F4;
      --body-text-color: #16181D;
      --card-background-color: #FAFAFA;
      --card-border-color: #D3D8DE;
      --nav-background-color: #FFFFFF;
      --nav-border-bottom-color: #D3D8DE;
      --nav-current-border-bottom-color: #33348C;
      --down-border-left-color: #C0392B;
      --down-background-color: #FBECEA;
      --degraded-border-left-color: #B7791F;
      --up-border-left-color: #1D6B3A;
      --tag-color: #16181D;
      --tag-up-background-color: #E3F4E8;
      --tag-down-background-color: #FBECEA;
      --tag-degraded-background-color: #FBF3E4;
      --change-background-color: #EAEAF1;
      --error-button-border-color: #33348C;
      --error-button-background-color: #33348C;
      --error-button-color: #FFFFFF;
      --submit-button-border-color: #33348C;
      --submit-button-background-color: #33348C;
      --submit-button-color: #FFFFFF;

      --ff-carbon: #33348C;
      --ff-ok: #1D6B3A;
      --ff-ink: #16181D;
      --ff-ink-soft: #5B6069;
      --ff-rule-strong: #B4BBC4;
    }

    html, body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif !important;
      color: var(--ff-ink);
    }

    h1, h2, h3, h4 {
      font-family: 'Bricolage Grotesque', 'Plus Jakarta Sans', system-ui, sans-serif !important;
      color: var(--ff-ink);
    }

    h1 { font-weight: 700 !important; font-size: 30px !important; line-height: 1.2 !important; margin: 0 0 8px !important; letter-spacing: -0.01em; }
    h2 { font-weight: 600 !important; font-size: 19px !important; margin: 32px 0 12px !important; }
    h3 { font-weight: 600 !important; font-size: 13px !important; opacity: 1 !important; color: var(--ff-ink-soft) !important; text-transform: uppercase; letter-spacing: 0.04em; margin: 24px 0 8px !important; }
    h4 {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif !important;
      font-weight: 600 !important;
      font-size: 15px !important;
      margin: 0 !important;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header p.lead { color: var(--ff-ink-soft) !important; font-size: 15px !important; font-weight: 400 !important; }

    /* ---- Nav ---- */
    /* nav's own padding used to stack with nav .container's padding (32px total), while
       main.container only ever got one layer (32px desktop / 16px mobile) — nav content was
       inset 16px further than the page below it at every width. Zero nav's own padding and let
       nav .container ride the same shared .container rule (global.css) main uses, so both
       compute the identical box. */
    nav { padding: 0 !important; margin-bottom: 24px !important; }
    nav .container { max-width: 800px; margin: 0 auto; }
    nav a { padding: 20px 16px !important; font-weight: 600 !important; font-size: 14px !important; color: var(--ff-ink-soft) !important; }
    nav a[aria-current] { color: var(--ff-carbon) !important; }
    nav .logo {
      font-family: 'Bricolage Grotesque', 'Plus Jakarta Sans', system-ui, sans-serif !important;
      font-weight: 700 !important;
      font-size: 18px !important;
      color: var(--ff-ink) !important;
      padding: 0 !important;
      margin-right: 8px !important;
    }
    nav .logo img { display: none !important; }

    /* ---- Cards ---- */
    article {
      border-radius: 12px !important;
      border-width: 1px !important;
      box-shadow: 0 1px 2px rgba(22, 24, 29, 0.05);
      padding: 16px !important;
    }
    article + article { margin-top: 10px !important; }
    /* global.css paints article.up/down/degraded's left border a status colour with its own
       !important — shrinking the width alone still leaves a coloured hairline (the classic
       stock-Upptime tell). Neutralise the colour too: status is carried only by the h4 dot. */
    article.up, article.down, article.degraded { border-left-width: 1px !important; border-left-color: var(--card-border-color) !important; }
    @media (hover: hover) {
      article.link:hover { border-color: var(--ff-rule-strong) !important; }
    }
    article.down-active { border-color: #C0392B !important; }
    article.degraded-active { background: #FBF3E4 !important; border-color: #B7791F !important; }

    /* Status carried by a chip-style dot (docs/BUILDER_DESIGN.md §4.4 .chip-live::before), not a
       left bar — scoped to .live-status only. Incidents/Scheduled/ActiveIncidents articles reuse
       these same up/down/degraded classes on an <article><h4>{incident title}</h4> — an unscoped
       selector would grow a status dot on an incident's title the day one exists. */
    .live-status article.up h4::before,
    .live-status article.down h4::before,
    .live-status article.degraded h4::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex: none;
    }
    .live-status article.up h4::before { background: var(--ff-ok); }
    .live-status article.down h4::before { background: #C0392B; }
    .live-status article.degraded h4::before { background: #B7791F; }

    /* Sparkline background on the home cards has no CSS hook of its own (Upptime targets a
       nonexistent nested .graph element, so --graph-opacity/--graph-filter are dead in the stock
       theme) — the raw teal diagonal read as noise against the card text, so it's dropped; the
       real, readable, recoloured graph lives on the detail page below. */
    article.graph { background-image: none !important; }

    /* The favicon fetch (icons.duckduckgo.com/ip3/<host>.ico) renders as a generic globe against a
       domain with no favicon of its own — the status dot already carries the signal. */
    .live-status .icon { display: none !important; }

    /* ---- Data values: FuguForm reserves mono type for counted/referenced numbers ---- */
    .data { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace !important; font-weight: 500 !important; font-variant-numeric: tabular-nums; }
    dl dt { font-family: 'Plus Jakarta Sans', system-ui, sans-serif !important; font-weight: 600 !important; font-size: 13px !important; color: var(--ff-ink-soft) !important; }
    dl dd { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace !important; font-weight: 500 !important; font-size: 20px !important; color: var(--ff-ink) !important; margin: 4px 0 16px !important; }

    /* ---- Tag chips: FuguForm's chip-live / chip-amber / chip-stamp pairs ---- */
    .tag {
      display: inline-flex !important;
      align-items: center !important;
      border-radius: 999px !important;
      padding: 3px 10px !important;
      font-weight: 600 !important;
      font-size: 12px !important;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif !important;
    }
    .tag::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 6px; }
    .tag.up, .tag.closed { background: #E3F4E8 !important; color: #1D6B3A !important; }
    .tag.down, .tag.open { background: #FBECEA !important; color: #A93226 !important; }
    .tag.degraded { background: #FBF3E4 !important; color: #8A5A12 !important; }

    /* ---- Live-status duration selector: docs/BUILDER_DESIGN.md §4.3 .seg (the one segmented
       control everywhere — "No underline tabs") rather than floating pill labels. The <form
       class="f r"> is also .f (global.css: space-between), which has to be overridden or the
       track collapses to spread across the row instead of hugging its own content. */
    form.r {
      display: inline-flex !important;
      justify-content: flex-start !important;
      flex-wrap: wrap !important;
      gap: 0 !important;
      padding: 3px !important;
      background: #EDF0F4 !important;
      border: 1px solid var(--ff-rule-strong) !important;
      border-radius: 8px !important;
    }
    .r input { display: none !important; }
    .r label {
      margin: 0 !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      min-height: 44px !important;
      padding: 0 12px !important;
      border-radius: 6px !important;
      font-weight: 600 !important;
      font-size: 13px !important;
      color: var(--ff-ink-soft) !important;
      cursor: pointer;
    }
    .r input:checked + label { background: #FFFFFF !important; color: var(--ff-ink) !important; box-shadow: 0 1px 2px rgba(22, 24, 29, 0.05) !important; }

    /* ---- Buttons and text input (rate-limit / error pages) ---- */
    a.error-button, .submit-button {
      border-radius: 8px !important;
      font-weight: 600 !important;
      padding: 10px 18px !important;
      border-width: 1px !important;
    }
    input[type="text"] {
      min-height: 44px !important;
      padding: 0 12px !important;
      border: 1px solid var(--ff-rule-strong) !important;
      border-radius: 8px !important;
      font-size: 16px !important;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif !important;
    }
    /* The "already have a token" branch renders a bare <button on:click={remove}> with no class
       (the submit branch's button carries .submit-button, styled above) — give it the same
       secondary-button shape rather than leaving it in stock 0.2rem-radius grey. */
    button:not(.submit-button) {
      min-height: 44px !important;
      padding: 0 16px !important;
      border: 1px solid var(--ff-rule-strong) !important;
      border-radius: 8px !important;
      background: #FFFFFF !important;
      color: var(--ff-ink) !important;
      font: 600 15px 'Plus Jakarta Sans', system-ui, sans-serif !important;
      cursor: pointer;
    }
    svg[stroke] { stroke: var(--ff-carbon) !important; }

    /* ---- Footer ---- */
    footer { opacity: 1 !important; color: var(--ff-ink-soft) !important; font-size: 13px !important; }
    footer a { color: var(--ff-ink-soft) !important; }

    /* ---- Detail page: recolour the response-time chart's default teal toward carbon ----
       Chart.js reads graphBorderColor/graphBackgroundColor, which are top-level .upptimerc.yml
       keys — outside the status-website:/i18n: block this file is scoped to, so the real fix
       (graphBorderColor: "#33348C", graphBackgroundColor: "#EAEAF1") needs an owner decision, not
       a CSS patch. hue-rotate(70deg) alone lands the hue right (~238° vs carbon's 239°) but
       can't touch the line's lightness, so it read as a washed-out periwinkle rather than carbon
       indigo — confirmed by rendering both against a static swatch locally. This raises
       saturation and lowers brightness for a noticeably closer, if still imperfect, match; the
       fill (already pale) can't be pushed toward carbon-wash independently of the line since one
       filter has to serve both. */
    canvas { filter: hue-rotate(68deg) saturate(1.8) brightness(0.75); }

    @media (max-width: 480px) {
      .container { padding: 0 16px !important; }
      nav a { padding: 16px 10px !important; font-size: 13px !important; }
      h1 { font-size: 24px !important; }
      .r label { padding: 0 9px !important; font-size: 12px !important; }
    }

